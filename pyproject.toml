[project]
name = "queue-broker-poc"
version = "0.1.0"
description = "POC: a job queue on Celery and Redis that loses nothing, because Postgres holds the record"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queue_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
