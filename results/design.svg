<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="System design: a receiver stores each job in Postgres and publishes its id to Redis; Celery workers claim and finish the row in Postgres; Celery beat sweeps Postgres and re-publishes unfinished rows"><style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.box{fill:none;stroke:#c3c2b7;stroke-width:1.5}.strong{stroke:#2a78d6;stroke-width:2}.wire{stroke:#52514e}.head{fill:#52514e}text{font:12px system-ui,-apple-system,'Segoe UI',sans-serif}</style><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class='bg' width='760' height='330' rx='8'/><rect class="box" x="16" y="46" width="100" height="48" rx="8"/><text class="ink" x="66.0" y="65" text-anchor="middle" font-weight="600">Caller</text><text class="ink2" x="66.0" y="81" text-anchor="middle">webhook, API</text><rect class="box" x="150" y="46" width="130" height="48" rx="8"/><text class="ink" x="215.0" y="65" text-anchor="middle" font-weight="600">Receiver</text><text class="ink2" x="215.0" y="81" text-anchor="middle">answers 202</text><rect class="box strong" x="410" y="24" width="184" height="92" rx="8"/><text class="ink" x="502.0" y="57" text-anchor="middle" font-weight="600">Postgres</text><text class="ink2" x="502.0" y="73" text-anchor="middle">inbox · outbox · reminders</text><text class="ink2" x="502.0" y="89" text-anchor="middle">the record of every job</text><rect class="box" x="410" y="214" width="164" height="64" rx="8"/><text class="ink" x="492.0" y="241" text-anchor="middle" font-weight="600">Redis</text><text class="ink2" x="492.0" y="257" text-anchor="middle">carries row ids only</text><rect class="box" x="150" y="222" width="130" height="48" rx="8"/><text class="ink" x="215.0" y="241" text-anchor="middle" font-weight="600">Celery beat</text><text class="ink2" x="215.0" y="257" text-anchor="middle">one process</text><rect class="box" x="632" y="196" width="116" height="100" rx="8"/><text class="ink" x="690.0" y="225" text-anchor="middle" font-weight="600">Celery workers</text><text class="ink2" x="690.0" y="241" text-anchor="middle">mail ×4</text><text class="ink2" x="690.0" y="257" text-anchor="middle">extract · browser</text><text class="ink2" x="690.0" y="273" text-anchor="middle">outbox</text><path class="wire" d="M116 70 H148" fill="none" stroke-width="1.5" marker-end="url(#head)"/><text class="ink2" x="0" y="0" text-anchor="middle"></text><path class="wire" d="M280 62 H408" fill="none" stroke-width="1.5" marker-end="url(#head)"/><text class="ink2" x="344" y="52" text-anchor="middle">1 · insert row</text><path class="wire" d="M268 94 L408 226" fill="none" stroke-width="1.5" marker-end="url(#head)"/><text class="ink2" x="318" y="172" text-anchor="end">2 · publish id</text><path class="wire" d="M280 252 H408" fill="none" stroke-width="1.5" marker-end="url(#head)"/><text class="ink2" x="344" y="272" text-anchor="middle">sweep · reminders</text><path class="wire" d="M574 246 H630" fill="none" stroke-width="1.5" marker-end="url(#head)"/><text class="ink2" x="602" y="236" text-anchor="middle">deliver</text><path class="wire" d="M690 196 V70 H596" fill="none" stroke-width="1.5" marker-end="url(#head)"/><text class="ink2" x="604" y="60" text-anchor="start">claim · work · finish</text><path class="wire" d="M492 116 V212" fill="none" stroke-width="1.5" marker-end="url(#head)" stroke-dasharray="5 4"/><text class="ink2" x="502" y="160" text-anchor="start">unfinished rows are</text><text class="ink2" x="502" y="176">published again</text></svg>